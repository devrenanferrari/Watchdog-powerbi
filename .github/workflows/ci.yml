name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A matriz precisa cobrir exatamente o que os classifiers prometem. Declarar
        # suporte a 3.9 sem rodar em 3.9 é como não suportar.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Testes
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir e validar a distribuição
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Instalar o wheel num ambiente limpo e exercitar a CLI
        # Um pacote que constrói mas não instala não serve de nada; este passo pega
        # package data faltando (o template do `init`) e entry point quebrado.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/pbi-watchdog --help
          cd /tmp && /tmp/clean/bin/pbi-watchdog init
          /tmp/clean/bin/python -c "import pbi_watchdog; print(pbi_watchdog.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
